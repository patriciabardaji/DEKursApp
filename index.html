<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0F7">
<title>DEKurs · Deutsch A1–B2</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DEKurs">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --ink:#302C3D;
  --ink-60:rgba(48,44,61,.62);
  --ink-38:rgba(48,44,61,.40);
  --ink-14:rgba(48,44,61,.15);
  --ink-07:rgba(48,44,61,.07);
  --paper:#F4F0F7;
  --card:#FFFFFF;
  --signal:#F5C451;
  --petrol:#3E8E6E;
  --petrol-soft:#E3F2EB;
  --rot:#C4586F;
  --rot-soft:#FBE8EC;
  --accent:#A99AD9;
  --accent-soft:#EFECFA;
  --serif:ui-rounded,"SF Pro Rounded","Avenir Next",Avenir,"Century Gothic","URW Gothic",Futura,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
body[data-sec="vocab"]  {--accent:#6FA8D8;--accent-soft:#E8F1FA}
body[data-sec="grammar"]{--accent:#DC87A2;--accent-soft:#FBEAEF}
body[data-sec="verbs"]  {--accent:#5CB795;--accent-soft:#E3F3EC}
body[data-sec="satz"]   {--accent:#E5A063;--accent-soft:#FCEEE0}
body[data-sec="blitz"]  {--accent:#E5BB3F;--accent-soft:#FBF2D8}
body[data-sec="stats"]  {--accent:#9B8AD4;--accent-soft:#EDEAF9}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* ---------- top bar ---------- */
.chromebar{position:sticky;top:0;z-index:20;background:var(--paper)}
.topbar{
  padding:12px 18px 10px;
  padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;flex-direction:column;gap:7px;
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.metarow{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-38);
}
.metarow b{color:var(--ink);font-weight:600}
.streakchip{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-60);border:1px solid var(--ink-14);border-radius:99px;padding:4px 10px;white-space:nowrap;
}
.streakchip[data-live="1"]{background:var(--signal);border-color:var(--signal);color:#241F30}
.wordmark{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;padding:0}
.wordmark em{
  font-style:normal;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);
  border:1px solid var(--ink-14);border-radius:6px;padding:2px 5px;margin-left:7px;vertical-align:2px;
}

/* ---------- mode nav ---------- */
.modes{
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--ink-14);background:var(--paper);
}
.modes::-webkit-scrollbar{display:none}
.mode{
  flex:1 0 auto;padding:11px 16px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-60);border-bottom:2px solid transparent;white-space:nowrap;
}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal);background:var(--ink-07)}

/* ---------- stage ---------- */
.stage{
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  flex:1;width:100%;max-width:640px;margin:0 auto;
  padding:20px 18px 40px;
  display:flex;flex-direction:column;
}

/* ---------- Karteikasten strip (signature) ---------- */
.kasten{display:flex;gap:4px;margin-bottom:18px}
.slot{
  flex:1;position:relative;height:36px;
  border:1px solid var(--ink-14);border-top-width:4px;border-top-color:var(--ink-14);
  border-radius:1px;background:rgba(255,255,255,.34);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;
  font-family:var(--mono);font-size:10px;color:var(--ink-38);
  transition:border-top-color .25s ease,background .25s ease,color .25s ease;
}
.slot b{font-weight:600;color:var(--ink-60);font-size:11px}
.kasten .slot:nth-child(1){border-top-color:#E795A8}
.kasten .slot:nth-child(2){border-top-color:#EDAF7C}
.kasten .slot:nth-child(3){border-top-color:#E8CB6B}
.kasten .slot:nth-child(4){border-top-color:#7FB6DF}
.kasten .slot:nth-child(5){border-top-color:#5CB795}
.slot[data-here="1"]{background:var(--card);box-shadow:0 2px 10px -6px rgba(48,44,61,.5)}
.slot[data-here="1"] b{color:var(--ink)}
.slot .flag{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:8px;height:8px;background:var(--ink);border-radius:50%;
}
.kastenlabel{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-38);margin:0 0 7px;
}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border:1px solid var(--ink-14);
  border-top:4px solid var(--accent);
  border-radius:6px;
  box-shadow:0 1px 0 var(--ink-07),0 12px 26px -20px rgba(23,25,28,.55);
  padding:26px 22px;
  position:relative;
}

.tab{
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-38);display:flex;justify-content:space-between;gap:12px;margin-bottom:26px;
}
.tab span:first-child{color:var(--accent);font-weight:600}
.tab span:last-child{color:var(--ink-60)}
.prompt{
  font-family:var(--serif);font-size:29px;line-height:1.32;letter-spacing:-.012em;
  margin:0 0 6px;
}
.prompt small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-38);text-transform:uppercase;margin-bottom:12px}
.sub{font-size:15px;color:var(--ink-60);margin:10px 0 0;line-height:1.5}
.example{
  font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink-60);
  border-left:2px solid var(--signal);padding-left:12px;margin-top:18px;
}
.answer{
  font-family:var(--serif);font-size:25px;line-height:1.35;margin:18px 0 0;
  padding-top:18px;border-top:1px dashed var(--ink-14);
}
.hidden{display:none !important}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.opt{
  text-align:left;padding:15px 16px;background:var(--card);
  border:1px solid var(--ink-14);border-radius:6px;
  font-family:var(--serif);font-size:19px;line-height:1.3;
  transition:border-color .12s ease,background .12s ease;
  min-height:52px;
}
.opt:hover{border-color:var(--ink-38)}
.opt[data-state="right"]{border-color:var(--petrol);background:var(--petrol-soft);box-shadow:inset 4px 0 0 var(--petrol)}
.opt[data-state="wrong"]{border-color:var(--rot);background:var(--rot-soft);box-shadow:inset 4px 0 0 var(--rot)}
.opt[disabled]{cursor:default}

/* ---------- typed input ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-38)}
.field input{
  width:100%;padding:13px 14px;background:var(--card);
  border:1px solid var(--ink-14);border-radius:6px;
  font-family:var(--serif);font-size:20px;
}
.field input[data-state="right"]{border-color:var(--petrol);box-shadow:inset 3px 0 0 var(--petrol)}
.field input[data-state="wrong"]{border-color:var(--rot);box-shadow:inset 3px 0 0 var(--rot)}
.umlauts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.umlauts button{
  border:1px solid var(--ink-14);border-radius:6px;background:var(--card);
  padding:7px 12px;font-family:var(--serif);font-size:17px;min-width:44px;
}

/* ---------- verdict ---------- */
.verdict{
  margin-top:20px;padding:14px 16px;border-radius:6px;border:1px solid var(--ink-14);
  background:rgba(255,255,255,.5);
}
.verdict h4{
  margin:0 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
}
.verdict[data-tone="right"]{background:var(--petrol-soft);border-color:var(--petrol)}
.verdict[data-tone="right"] h4{color:var(--petrol)}
.verdict[data-tone="wrong"]{background:var(--rot-soft);border-color:var(--rot)}
.verdict[data-tone="wrong"] h4{color:var(--rot)}
.verdict p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-60)}
.why{color:var(--ink-60);font-size:14px;line-height:1.5;display:inline-block;margin-top:5px}
.verdict strong{color:var(--ink);font-family:var(--serif);font-size:17px;font-weight:400}

/* ---------- action bar ---------- */
.actions{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.btn{
  flex:1;min-width:120px;min-height:52px;padding:15px 18px;border-radius:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--accent);background:var(--accent);color:#241F30;
  transition:transform .08s ease,filter .12s ease;
}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink-14)}
.btn.ghost:hover{border-color:var(--ink-38)}
.btn.yes{background:var(--petrol);border-color:var(--petrol);color:#FFFFFF}
.btn.no{background:transparent;border-color:var(--rot);color:var(--rot)}
.btn.wide{flex:1 0 100%}

/* ---------- session rail ---------- */
.rail{display:flex;gap:3px;margin-top:auto;padding-top:26px}
.tick{flex:1;height:4px;background:var(--ink-14);border-radius:1px}
.tick[data-t="right"]{background:var(--petrol)}
.tick[data-t="wrong"]{background:var(--rot)}
.tick[data-t="now"]{background:var(--signal)}

/* ---------- sentence builder ---------- */
.slotline{
  min-height:78px;border:1px dashed var(--ink-14);border-radius:6px;
  background:rgba(255,255,255,.4);padding:11px;margin-top:20px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{
  padding:10px 13px;border:1px solid var(--ink-14);border-radius:6px;background:var(--card);
  font-family:var(--serif);font-size:18px;line-height:1.1;
}
.chip:hover{border-color:var(--ink-38)}
.chip.placed{background:var(--ink-07);border-style:solid}
.chip[data-state="right"]{border-color:var(--petrol);background:var(--petrol-soft)}
.chip[data-state="wrong"]{border-color:var(--rot);background:var(--rot-soft)}

/* ---------- topic picker ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:16px}
.tile{
  text-align:left;padding:15px 14px;background:var(--card);border:1px solid var(--ink-14);border-radius:6px;
}
.tile:hover{border-color:var(--ink-38)}
.tile[data-on="1"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--signal)}
.tile b{display:block;font-family:var(--serif);font-size:17px;font-weight:400;line-height:1.25;margin-bottom:5px}
.tile span{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--ink-38);text-transform:uppercase}

/* ---------- headings & prose ---------- */
.h{font-family:var(--serif);font-size:24px;font-weight:400;margin:0 0 4px;letter-spacing:-.01em}
.hsub{font-size:14px;color:var(--ink-60);margin:0 0 8px;line-height:1.55}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-38);margin:0 0 10px}
.divider{height:1px;background:var(--ink-14);margin:26px 0}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--ink-14);border-radius:6px;padding:14px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.stat span{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-38)}
.bars{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:112px 1fr 34px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:7px;background:var(--ink-14);border-radius:1px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .num{font-family:var(--mono);font-size:11px;color:var(--ink-38);text-align:right}
.bar .name{font-family:var(--serif);font-size:15px;line-height:1.2}
.note{font-size:13px;color:var(--ink-60);line-height:1.6;margin-top:14px}
.note code{font-family:var(--mono);font-size:12px;background:var(--ink-07);padding:1px 4px;border-radius:6px}



.hint{
  font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink-60);
  border-left:2px solid var(--ink-14);padding-left:12px;margin-top:16px;
}
.hint em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-38);display:block;margin-bottom:5px}
.tiphint{margin-top:12px;padding-top:11px;border-top:1px dashed var(--ink-14)}
.clue{margin:0;font-family:var(--serif);font-size:19px;line-height:1.4;color:var(--ink)}
.tiphint em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-38);display:block;margin-bottom:6px}
.pattern{font-family:var(--mono);font-size:21px;letter-spacing:.14em;color:var(--ink);white-space:pre-wrap;line-height:1.5}
.tiny{background:none;border:0;padding:0;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-38);text-decoration:underline;text-underline-offset:3px}
.tiny:hover{color:var(--ink)}
.override{margin-top:12px}


.planbig{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.2;margin:2px 0 4px;letter-spacing:-.01em}
.plansub{font-size:14px;line-height:1.5;color:var(--ink-60);margin:0 0 14px}
.check{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.check li{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:6px;cursor:pointer}
.check li:hover{background:var(--ink-07)}
.check .mark{
  flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:600;
  background:var(--signal);color:#241F30;
}
.check li[data-done="1"] .mark{background:var(--petrol-soft);color:var(--petrol)}
.check .what{display:flex;flex-direction:column;gap:1px;min-width:0}
.check .what b{font-family:var(--serif);font-size:16px;font-weight:600}
.check li[data-done="1"] .what b{font-weight:400;color:var(--ink-60)}
.check .what span{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-38)}
.streakwrap{border:1px solid var(--ink-14);border-radius:6px;padding:14px 16px;margin-top:12px;background:var(--card)}

.courses{display:flex;gap:7px;margin-bottom:14px}
.course{
  flex:1;padding:10px 8px;border:1px solid var(--ink-14);border-radius:6px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.course b{font-family:var(--serif);font-size:16px;font-weight:600}
.course span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-38)}
.course[data-on="1"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.course[data-on="1"] span{color:var(--ink-60)}

.levels{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:8px}
.level{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:20px 16px 16px;background:var(--card);border:1px solid var(--ink-14);
  border-top:5px solid var(--accent);border-radius:8px;text-align:left;
}
.level:hover{border-color:var(--ink-38)}
.level:nth-child(1){border-top-color:#6FA8D8}
.level:nth-child(2){border-top-color:#5CB795}
.level:nth-child(3){border-top-color:#E5BB3F}
.level:nth-child(4){border-top-color:#E5A063}
.level:nth-child(5){border-top-color:#DC87A2}
.level:nth-child(6){border-top-color:#9B8AD4}
.level:nth-child(7){border-top-color:#5C9EA6}
.level:nth-child(8){border-top-color:#B2708F}
.lv-code{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.lv-name{font-size:14px;color:var(--ink-60);line-height:1.3}
.lv-bar{display:block;width:100%;height:5px;background:var(--ink-14);border-radius:99px;overflow:hidden;margin-top:6px}
.lv-bar i{display:block;height:100%;background:var(--ink-38)}
.level:nth-child(1) .lv-bar i{background:#6FA8D8}
.level:nth-child(2) .lv-bar i{background:#5CB795}
.level:nth-child(3) .lv-bar i{background:#E5BB3F}
.level:nth-child(4) .lv-bar i{background:#E5A063}
.level:nth-child(5) .lv-bar i{background:#DC87A2}
.level:nth-child(6) .lv-bar i{background:#9B8AD4}
.level:nth-child(7) .lv-bar i{background:#5C9EA6}
.level:nth-child(8) .lv-bar i{background:#B2708F}
.lv-meta{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-38)}

.nag{
  display:flex;flex-direction:column;gap:7px;margin-top:12px;padding:15px 16px;
  border:1px solid var(--signal);border-left:5px solid var(--signal);border-radius:6px;
  background:#FDF7E4;
}
.nag b{font-family:var(--serif);font-size:16px;font-weight:600}
.nag span{font-size:13px;line-height:1.5;color:var(--ink-60)}
.nag .btn{margin-top:4px}

.guide{
  border:1px solid var(--ink-14);border-radius:6px;background:var(--card);
  margin-top:10px;overflow:hidden;
}
.guide summary{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 16px;cursor:pointer;list-style:none;
  font-family:var(--serif);font-size:17px;font-weight:600;
}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-family:var(--mono);font-size:19px;color:var(--ink-38);font-weight:400}
.guide[open] summary::after{content:"–"}
.guide summary span{
  margin-left:auto;margin-right:4px;
  font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-38);font-weight:400;
}
.guide-body{padding:0 16px 16px;border-top:1px solid var(--ink-07)}
.guide-body p{margin:13px 0 0;font-size:14px;line-height:1.6;color:var(--ink-60)}
.guide-body p b{color:var(--ink)}
.guide-body ol{margin:13px 0 0;padding-left:20px}
.guide-body li{font-size:14px;line-height:1.6;color:var(--ink-60);margin-bottom:7px}
.guide-body li b{color:var(--ink)}

.caps{display:flex;gap:8px;margin-top:12px}
.capbtn{
  flex:1;padding:13px 6px;border:1px solid var(--ink-14);border-radius:6px;background:var(--card);
  font-family:var(--mono);font-size:12px;letter-spacing:.04em;
}
.capbtn[data-on="1"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}

.board{display:flex;gap:6px;margin-top:14px}
.bslot{
  flex:1;background:var(--card);border:1px solid var(--ink-14);border-top:4px solid var(--ink-14);
  border-radius:6px;padding:12px 4px 10px;text-align:center;
}
.bslot:nth-child(1){border-top-color:#E795A8}
.bslot:nth-child(2){border-top-color:#EDAF7C}
.bslot:nth-child(3){border-top-color:#E8CB6B}

const KEY = "dekurs-v3";

const store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    if(mem[KEY]) return JSON.parse(mem[KEY]);
    return null;
  },
  async save(obj){
    const s = JSON.stringify(obj);
    mem[KEY] = s;
    try{ if(window.storage){ await window.storage.set(KEY, s); return; } }catch(e){}
    try{ localStorage.setItem(KEY, s); }catch(e){}
  }
};

/* ---------- pools & scheduling ---------- */
const kind = id => id.split("|")[1][0];
const idx  = id => +id.split("|")[1].slice(1);
const pool = m => {
  const P_ = CV + "|";
  if(m==="vocab")   return VOCAB.map((_,i)=>P_+"v"+i);
  if(m==="grammar") return GRAMMAR.map((_,i)=>P_+"g"+i).filter(id => !S.topic || GRAMMAR[idx(id)][0]===S.topic);
  if(m==="verbs")   return VERBS.map((_,i)=>P_+"b"+i);
  if(m==="satz")    return SENTENCES.map((_,i)=>P_+"s"+i);
  return [];
};
const mine = () => Object.keys(P.p).filter(k => k.startsWith(CV + "|"));
const rec = id => P.p[id] || null;   // ids already carry the course prefix
const isDue = id => { const r = rec(id); return r && r.d <= DAY(); };
const dueCount = m => { const s=S.topic; S.topic=null; const n=pool(m).filter(isDue).length; S.topic=s; return n; };
const allDue = () => ["vocab","grammar","verbs","satz"].reduce((a,m)=>a+dueCount(m),0);

function buildQueue(m, force){
  const all = pool(m);
  const due = all.filter(isDue).sort((a,b)=>rec(a).d - rec(b).d);
  let fresh = all.filter(id => !rec(id));

  // new grammar cards rotate through the topics, so no theme waits until the end
  if(m === "grammar" && fresh.length && !S.topic){
    const order = {}; GTOPICS.forEach((t,i) => order[t[0]] = i);
    const seen = {};
    fresh = fresh.map(id => {
      const t = GRAMMAR[idx(id)][0];
      seen[t] = (seen[t] || 0) + 1;
      return {id, round: seen[t], topic: order[t] ?? 99};
    }).sort((a,b) => a.round - b.round || a.topic - b.topic).map(x => x.id);
  }
  const soon = all.filter(id => rec(id) && rec(id).d > DAY()).sort((a,b)=>rec(a).d - rec(b).d);
  const budget = force ? SESSION : secLeft(m);
  let q = due.concat(fresh).slice(0, Math.min(SESSION, budget));
  if(!q.length && force) q = soon.slice(0, 8);   // everything seen → review ahead of schedule
  return q;
}

}

function secShares(){
  const sm = S.mode, stp = S.topic;
  const sizes = {}; let total = 0;
  SECS.forEach(k => { S.mode = k; S.topic = null; const n = pool(k).length; sizes[k] = n; total += n; });
  S.mode = sm; S.topic = stp;

  const daily = dailyCards(), MIN = 3;
  const raw = {}, out = {};
  let sum = 0;
  SECS.forEach(k => { raw[k] = daily * sizes[k] / total; out[k] = Math.max(MIN, Math.floor(raw[k])); sum += out[k]; });

  // hand out the remainder to the biggest fractions so the total lands exactly on target
  const order = SECS.slice().sort((a,b) => (raw[b]-out[b]) - (raw[a]-out[a]));
  let i = 0, guard = 0;
  while(sum < daily && guard++ < 999){ out[order[i++ % order.length]]++; sum++; }
  i = 0; guard = 0;
  while(sum > daily && guard++ < 999){
    const k = order[order.length - 1 - (i++ % order.length)];
    if(out[k] > MIN){ out[k]--; sum--; }
    else if(SECS.every(x => out[x] <= MIN)) break;
  }
  return out;
}
function secTarget(m){ return secShares()[m] * (1 + bonus()); }
const secLeft = m => Math.max(0, secTarget(m) - secDone(m));
const dayTarget = () => SECS.reduce((a,m) => a + secTarget(m), 0);
function addXP(n){
  touchDay();
  P.xp += n; P.dayXp += n;
  if(P.dayXp >= GOAL && P.goalDay !== DAY()){
    P.streak = (P.goalDay === DAY()-1) ? P.streak + 1 : 1;
    P.goalDay = DAY();
  }
}
function studyStreak(){
  const days = (P.days || []).slice().sort((a,b)=>a-b);
  if(!days.length) return 0;
  const last = days[days.length-1];
  if(last < DAY() - 1) return 0;          // the run is broken
  let n = 1;
  for(let i = days.length - 1; i > 0; i--){
    if(days[i] - days[i-1] === 1) n++; else break;
  }
  return n;
}
function fullDays(){ return P.fullDays || []; }
function levelForecast(){
  const size = courseSize(CV);
  const seen = mine().length;
  const unseen = size - seen;
  const activeDays = (P.levelDays || {})[CV] || 0;
  if(!unseen) return {seen, size, unseen, days: 0, activeDays};
  // use the learner's own pace once there is one, otherwise a rough estimate
  const rate = activeDays >= 2 ? Math.max(1, seen / activeDays) : dailyCards() * 0.25;
  return {seen, size, unseen, days: Math.ceil(unseen / rate), activeDays};
}
function level(){
  let i = 0;
  for(let k=0;k<LEVELS.length;k++) if(P.xp >= LEVELS[k][0]) i = k;
  const next = LEVELS[i+1] || null;
  return {i, name:LEVELS[i][1], gloss:LEVELS[i][2], at:LEVELS[i][0], next};
}
function levelPct(){
  const l = level();
  if(!l.next) return 100;
  return Math.round((P.xp - l.at) / (l.next[0] - l.at) * 100);
}

function grade(id, ok){
  touchDay();
  const sec = SECOF[kind(id)];
  P.ansBySec[CV + "|" + sec] = secDone(sec) + 1;

  const today = DAY();
  P.days = P.days || [];
  if(P.days[P.days.length-1] !== today){ P.days.push(today); P.days = P.days.slice(-90); }
  P.levelDays = P.levelDays || {};
  P.levelLast = P.levelLast || {};
  if(P.levelLast[CV] !== today){ P.levelLast[CV] = today; P.levelDays[CV] = (P.levelDays[CV] || 0) + 1; }
  const r = rec(id) || {b:1, d:DAY(), n:0, k:0};
  r.n++; if(ok) r.k++;
  r.b = ok ? Math.min(5, r.b + 1) : 1;
  r.d = DAY() + STEPS[r.b];
  P.p[id] = r;
}
function score(ok, factor){
  if(!ok){ S.combo = 0; return 0; }
  S.combo++;
  if(S.combo > S.best) S.best = S.combo;
  if(S.combo > P.bestCombo) P.bestCombo = S.combo;
  const pts = Math.round(10 * (1 + Math.min(S.combo - 1, 10) * 0.1) * (factor || 1));
  S.pts += pts; addXP(pts);
  return pts;
}

/* ---------- Stempel ---------- */
function boxAtLeast(prefix, n, box){
  const s = S.topic; S.topic = null;
  const m = prefix==="v" ? "vocab" : prefix==="b" ? "verbs" : prefix==="s" ? "satz" : "grammar";
  const c = pool(m).filter(id => rec(id) && rec(id).b >= box).length;
  S.topic = s;
  return c >= n;
}
function topicMastered(){
  const s = S.topic;
  const done = GTOPICS.some(t => {
    S.topic = t[0];
    const all = pool("grammar");
    return all.length > 0 && all.every(id => rec(id) && rec(id).b >= 4);
  });
  S.topic = s;
  return done;
}
function checkStamps(ctx){
  ctx = ctx || {};
  const got = [];
  const win = k => { if(!P.stamps[k]){ P.stamps[k] = DAY(); got.push(k); } };
  if(P.sessions >= 1) win("erst");
  if(P.dayXp >= GOAL) win("ziel");
  if(P.streak >= 3) win("s3");
  if(P.streak >= 7) win("s7");
  if(P.streak >= 14) win("s14");
  if(ctx.perfect) win("rein");
  if(P.bestCombo >= 10) win("k10");
  if(P.bestCombo >= 20) win("k20");
  if(boxAtLeast("v",50,3)) win("w50");
  if(boxAtLeast("b",25,3)) win("v25");
  if(boxAtLeast("s",15,3)) win("sb15");
  if(topicMastered()) win("gthema");
  if(P.blitzBest >= 15) win("blitz");
  if(ctx.sessionEnd && allDue() === 0 && mine().length > 20) win("leer");
  return got;
}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).toLowerCase().trim()
  .replace(/[.,!?;]+$/,"").replace(/\s+/g," ")
  .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue");

function lev(a,b){
  const m=a.length,n=b.length;
  if(!m||!n) return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
const lead = s => s.replace(/^to\s+/,"").replace(/^(the|a|an)\s+/,"");
function enVariants(en){
  const out = new Set();
  en.split(/[,;\/]/).forEach(part=>{
    [part, part.replace(/\(.*?\)/g,"")].forEach(x=>{
      const n = norm(x); if(n) out.add(n);
      const l = lead(n); if(l) out.add(l);
    });
  });
  return [...out];
}
function deBase(de){ return de.replace(/,.*$/,"").trim(); }
function deVariants(de){
  const base = deBase(de);
  const noArt = base.replace(/^(der|die|das)\s+/i,"");
  return [...new Set([norm(base), norm(noArt)])];
}
function judgeOne(a, targets){
  if(!a) return "no";
  if(targets.includes(a)) return "yes";
  for(const t of targets){
    if(t.length>=4 && a.length>=4){
      const q = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      if(new RegExp("(^| )"+q(a)+"( |$)").test(t)) return "yes";
      if(new RegExp("(^| )"+q(t)+"( |$)").test(a)) return "yes";
    }
  }
  for(const t of targets){
    if(Math.abs(a.length-t.length)<=2 && lev(a,t) <= (t.length>7?2:1)) return "near";
  }
  return "no";
}
function judge(input, targets){
  const pieces = String(input).split(/[,;\/]/).map(x => lead(norm(x))).filter(Boolean);
  let best = "no";
  for(const a of pieces){
    const v = judgeOne(a, targets);
    if(v === "yes") return "yes";
    if(v === "near") best = "near";
  }
  return best;
}
function hintSentence(ex, de){
  const MASK = "\u2013\u2013\u2013\u2013\u2013\u2013";
  const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  let out = ex;
  const words = deBase(de).replace(/^(der|die|das)\s+/i,"").split(/\s+/).filter(Boolean);
  const reflexive = /^sich$/i.test(words[0] || "");

  const PREFIXES = ["zusammen","herunter","hinunter","zurück","weiter","statt","teil","fest","nach","vor","aus","auf","ein","mit","los","weg","bei","her","hin","ab","an","um","zu"];
  const mask = w => {
    if(w.length >= 4){
      const stem = rx(w.slice(0, Math.max(4, w.length - 3)));
      out = out.replace(new RegExp("[A-Za-zÄÖÜäöüß]*" + stem + "[A-Za-zÄÖÜäöüß]*", "gi"), MASK);
    } else {
      out = out.replace(new RegExp("(^|\\s)" + rx(w) + "(?=\\s|$|[.,!?;:])", "gi"), (m, p1) => p1 + MASK);
    }
  };

  words.forEach(t => {
    if(!/^[A-Za-zÄÖÜäöüß-]+$/.test(t)) return;
    // separable verb? mask the base verb and the detached prefix as well
    const pre = PREFIXES.find(x => t.toLowerCase().startsWith(x) && t.length - x.length >= 4);
    if(pre){ mask(t.slice(pre.length)); mask(pre); }
    if(t.length >= 4){
      // long words: hide the stem so conjugated forms go too (kommen → komme, kommst)
      const stem = rx(t.slice(0, Math.max(4, t.length - 3)));
      out = out.replace(new RegExp("[A-Za-zÄÖÜäöüß]*" + stem + "[A-Za-zÄÖÜäöüß]*", "gi"), MASK);
    } else {
      // short particles like "aus", "an", "um" — whole word only
      out = out.replace(new RegExp("(^|\\s)" + rx(t) + "(?=\\s|$|[.,!?;:])", "gi"), (m, p1) => p1 + MASK);
    }
  });
  // reflexive verbs: the pronoun changes with the person, hide it too
  if(reflexive) out = out.replace(/(^|\s)(mich|dich|sich|uns|euch|mir|dir)(?=\s|$|[.,!?;:])/gi, (m, p1) => p1 + MASK);
  return out;
}
function wordClass(de){
  if(/^(der|die|das)\s/i.test(de)) return "Nomen";
  if(/^sich\s/i.test(de) || /(en|ern|eln)$/.test(deBase(de).split(" ")[0])) return "Verb";
  if(/\(Pl\.\)/.test(de)) return "Nomen (Plural)";
  return "Adjektiv oder Wendung";
}
function pattern(s){
  // first letter of each word, the rest as underscores
  return s.split(/\s+/).map(w => w.charAt(0) + w.slice(1).replace(/[A-Za-zÄÖÜäöüß]/g, "_")).join("   ");
}

              + (P.name && P.name !== "–" ? ", " + P.name : "");

  const keys = [["vocab","Vokabeln","Wörter tippen"],["grammar","Grammatik",GTOPICS.length + " Themen"],
                ["verbs","Verben",VHEAD],["satz","Satzbau","Wortstellung"]];
  const st = {}; keys.forEach(([k])=> st[k] = sectionStats(k));
  const doneToday = ansToday();
  const target = dayTarget();
  const leftToday = SECS.reduce((a,m) => a + Math.min(secLeft(m), st[m].due + st[m].fresh), 0);
  const mins = Math.max(1, Math.round(leftToday * SEC_PER_CARD / 60));
  const nothingLeft = keys.every(([k]) => st[k].due + st[k].fresh === 0);

  // send them to whichever section is furthest from its share, reviews first
  let nextK = keys.map(([k])=>k)
    .filter(k => Math.min(secLeft(k), st[k].due + st[k].fresh) > 0)
    .sort((a,b) => (st[b].due - st[a].due) || (secLeft(b) - secLeft(a)))[0];

  const plan = nothingLeft
    ? `<p class="planbig">Diese Stufe ist durch</p>
       <p class="plansub">Alle ${courseSize(CV)} Karten sitzen im Kasten. Zeit für die nächste Stufe.</p>`
    : leftToday === 0
      ? `<p class="planbig">Tagesziel erreicht</p>
         <p class="plansub">${doneToday} Karten heute, etwa ${Math.round(doneToday*SEC_PER_CARD/60)} Minuten. Du kannst hier aufhören — oder schon den Stoff von morgen holen.</p>`
      : `<p class="planbig">${leftToday} Karten heute</p>
         <p class="plansub">Etwa ${mins} Minute${mins===1?"":"n"}${doneToday ? ` · ${doneToday} von ${target} schon geschafft` : ` · Tagesziel ${goalMin()} Minuten`}${bonus() ? " · Zusatzrunde" : ""}</p>`;

  const checklist = keys.map(([k,name])=>{
    const s = st[k];
    const avail = s.due + s.fresh;
    const todo = Math.min(secLeft(k), avail);
    const done = todo === 0;
    const what = s.due ? `${Math.min(todo, s.due)} zum Wiederholen` : `${todo} neue`;
    const note = avail === 0 ? "komplett gelernt"
               : todo === 0 ? `heute fertig · ${secDone(k)} Karten`
               : `${secDone(k)} von ${secTarget(k)} · noch ${what}`;
    return `<li data-k="${k}" data-done="${done?1:0}">
      <span class="mark">${done ? "✓" : todo}</span>
      <span class="what"><b>${name}</b><span>${note}</span></span>
    </li>`;
  }).join("");

  const fc = levelForecast();
  const strip = [];
  for(let i=6;i>=0;i--){
    const dd = DAY() - i;
    const state = fullDays().includes(dd) ? "full" : (P.days||[]).includes(dd) ? "part" : "none";
    strip.push(`<i data-day="${state}"></i>`);
  }

  const secs = keys.map(([k,name,sub])=>{
    const s = st[k];
    const tag = s.due ? `${s.due} fällig` : s.fresh ? `${s.fresh} neu` : "fertig";
    return `<button data-go="${k}">
      <div class="row"><span><b>${name}</b><span class="sub2">${sub} · ${s.solid}/${s.n} sitzt</span></span>
      <span class="due" data-hot="${s.due?1:0}">${tag}</span></div>
      <div class="mini"><i style="width:${Math.round(s.solid/s.n*100)}%"></i></div>
    </button>`;
  }).join("");

  $("#stage").innerHTML = `
  <div class="hero">
    <p class="who">${hello}.</p>
    <p class="lvl">Stufe ${l.i+1} · ${l.name} · ${P.xp} Punkte</p>
    ${plan}
    <div class="track2"><i style="width:${Math.min(100, Math.round(doneToday/target*100))}%"></i></div>
    <div class="goal"><span>${doneToday} von ${target} Karten</span><span>${P.dayXp} Punkte heute</span></div>
    <ul class="check">${checklist}</ul>
    ${nothingLeft ? `<button class="btn wide" id="switch" style="margin-top:16px">Andere Stufe wählen</button>`
      : leftToday ? `<button class="btn wide" id="start" style="margin-top:16px">Los geht's</button>`
      : `<button class="btn ghost wide" id="ahead" style="margin-top:16px">Stoff von morgen holen</button>`}
  </div>

  ${backupNag()}
  <div class="streakwrap">
    <div class="wrapline"><span>Letzte 7 Tage</span><span>${studyStreak()} in Folge</span></div>
    <div class="streakline">${strip.join("")}</div>
    <div class="wrapline foot">
      <span>${fc.activeDays ? "Tag " + fc.activeDays + " auf " + CV : "Stufe " + CV}</span>
      <span>${fc.seen} von ${fc.size} Karten begonnen</span>
    </div>
    ${fc.unseen
      ? `<p class="fcnote">Bei diesem Tempo hast du in etwa <b>${fc.days} Tag${fc.days===1?"":"en"}</b> jede Karte einmal gesehen. Bis sie dann wirklich sitzen, vergehen noch rund zwei Wochen Wiederholung.</p>`
      : `<p class="fcnote">Du hast jede Karte dieser Stufe schon gesehen — jetzt zählt nur noch das Wiederholen.</p>`}
  </div>

  <p class="eyebrow" style="margin:24px 0 0">Alle Bereiche</p>
  <div class="sect">${secs}</div>

  <p class="eyebrow" style="margin:24px 0 0">Mehr</p>
  <div class="sect">
    <button data-go="welcome"><div class="row"><span><b>Alle Stufen</b><span class="sub2">Kursstufe wählen und vergleichen</span></span>
      <span class="due">${COURSE_ORDER.length} Stufen</span></div></button>
    <button data-go="blitz"><div class="row"><span><b>Blitz</b><span class="sub2">60 Sekunden gemischt</span></span>
      <span class="due">Rekord ${P.blitzBest}</span></div></button>
    <button data-go="stats"><div class="row"><span><b>Fortschritt</b><span class="sub2">Kasten, Stempel, Sicherung</span></span>
      <span class="due">${Object.keys(P.stamps).length}/${STAMPS.length} Stempel</span></div></button>
    <button data-go="sheet"><div class="row"><span><b>Spickzettel</b><span class="sub2">Regeln, Verben und Wortschatz auf einen Blick</span></span>
      <span class="due">${CV}</span></div></button>
  </div>`;

  $("#stage").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  $("#stage").querySelectorAll(".check li").forEach(li => li.onclick = () => go(li.dataset.k));
  if($("#start")) $("#start").onclick = () => go(nextK);
  if($("#switch")) $("#switch").onclick = () => go("welcome");
  if($("#ahead")) $("#ahead").onclick = () => {
    P.bonusBySec[CV] = bonus() + 1;      // pull one more day's worth forward
    store.save(P); renderHome();
  };
  if($("#nagbtn")) $("#nagbtn").onclick = () => go("stats");
}

/* =====================================================================
   SESSION SCREENS
   ===================================================================== */
function render(){
  if(S.i >= S.queue.length) return renderDone();
  const id = S.queue[S.i];
  const t = kind(id);
  if(t==="v") renderVocab(id);
  if(t==="g") renderGrammar(id);
  if(t==="b") renderVerb(id);
  if(t==="s") renderSatz(id);
}
function markFullDay(){
  if(ansToday() < dayTarget()) return;
  P.fullDays = P.fullDays || [];
  if(!P.fullDays.includes(DAY())){ P.fullDays.push(DAY()); P.fullDays = P.fullDays.slice(-90); }
}
function next(ok, factor){
  const id = S.queue[S.i];
  S.retry = S.retry || {};
  const again = S.retry[id] || 0;

  S.marks[S.i] = ok;
  if(!again) grade(id, ok);      // the box only moves on the first attempt
  const pts = again ? 0 : score(ok, factor);
  if(pts) pop("+" + pts);
  store.save(P);

  // wrong? put it back in the queue — the session ends when everything is right
  if(!ok && again < 3){
    S.retry[id] = again + 1;
    S.queue.push(id);
  }

  markFullDay();
  S.i++; S.locked = false;
  chrome(); render();
}

/* ---------- Vokabeln ---------- */
const DIRS = {de:"DE → EN tippen", en:"EN → DE tippen", flip:"Karte umdrehen"};

function renderVocab(id){
  const v = VOCAB[idx(id)];
  const r = rec(id);
  const head = `<div class="tab"><span>${esc(v[2])}</span>${comboHTML()}</div>`;
  const foot = `<div class="actions"><button class="btn ghost" id="dir">${DIRS[P.dir] || DIRS.de}</button></div>` + railHTML();
  const cycle = () => { P.dir = P.dir==="de" ? "en" : P.dir==="en" ? "flip" : "de"; store.save(P); render(); };

  if(P.dir === "flip"){
    $("#stage").innerHTML = `
    <div class="card">${head}
      <p class="prompt"><small>Deutsch</small>${esc(v[0])}</p>
      <div id="back" class="hidden">
        <p class="answer">${esc(v[1])}</p>
        ${v[3] ? `<p class="example">${esc(v[3])}</p>` : ""}
      </div>
      <div class="actions" id="act"><button class="btn wide" id="flip">Umdrehen</button></div>
    </div>` + foot;
    $("#dir").onclick = cycle;
    $("#flip").onclick = () => {
      $("#back").classList.remove("hidden");
      $("#act").innerHTML = `<button class="btn no" id="again">Nochmal</button><button class="btn yes" id="knew">Gewusst</button>`;
      $("#again").onclick = () => next(false);
      $("#knew").onclick  = () => next(true, 0.6);   // self-graded, so worth less
    };
    return;
  }

  const toEn = P.dir === "de";
  const front = toEn ? v[0] : v[1];
  const solution = toEn ? v[1] : deBase(v[0]);
  let targets;
  if(toEn){
    targets = enVariants(v[1]);
  } else {
    // several German words can share one English meaning — accept any of them
    const meaning = new Set(enVariants(v[1]));
    const acc = [];
    VOCAB.forEach(x => {
      if(x === v || enVariants(x[1]).some(e => meaning.has(e))) acc.push(...deVariants(x[0]));
    });
    targets = [...new Set(acc)];
  }
  const hint = v[3]
    ? `<em>Kontext</em>${esc(hintSentence(v[3], v[0]))}`
    : `<em>Hinweis</em>${esc(wordClass(v[0]))} · ${esc(v[2])}`;
  let usedTip = false;

  $("#stage").innerHTML = `
  <div class="card">${head}
    <p class="prompt"><small>${toEn ? "Was heißt das auf Englisch?" : "Wie heißt das auf Deutsch?"}</small>${esc(front)}</p>
    <div class="hint">${hint}<div id="tip"></div></div>
    <div class="field">
      <label for="ans">${toEn ? "Englisch" : "Deutsch (Artikel optional)"}</label>
      <input id="ans" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="…">
    </div>
    ${toEn ? "" : `<div class="umlauts">${["ä","ö","ü","ß"].map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div>`}
    <div id="verd"></div>
    <div class="actions" id="act">
      <button class="btn ghost" id="tipbtn">Tipp (halbe Punkte)</button>
      <button class="btn" id="check">Prüfen</button>
    </div>
  </div>` + foot;

  const inp = $("#ans");
  inp.focus();
  $("#dir").onclick = cycle;
  $("#stage").querySelectorAll(".umlauts button").forEach(b => b.onmousedown = e => {
    e.preventDefault();
    const s = inp.selectionStart ?? inp.value.length;
    inp.value = inp.value.slice(0,s) + b.dataset.c + inp.value.slice(inp.selectionEnd ?? s);
    inp.focus(); inp.selectionStart = inp.selectionEnd = s + 1;
  });
  const lettersHTML = () => {
    const words = solution.trim().split(/\s+/).length;
    return `<div class="tiphint"><em>${toEn ? "Englisch" : "Deutsch"} · ${words} ${words===1?"Wort":"Wörter"}</em>
      <div class="pattern">${esc(pattern(solution))}</div></div>`;
  };
  const clue = toEn ? CLUES[v[0]] : null;
  $("#tipbtn").onclick = () => {
    usedTip = true;
    if(clue){
      $("#tip").innerHTML = `<div class="tiphint"><em>Bedeutung</em>
        <p class="clue">${esc(clue)}</p></div>`;
      $("#tipbtn").outerHTML = `<button class="btn ghost" id="tipbtn2">Buchstaben zeigen</button>`;
      $("#tipbtn2").onclick = () => {
        $("#tip").innerHTML += lettersHTML();
        $("#tipbtn2").remove();
        inp.focus();
      };
    } else {
      $("#tip").innerHTML = lettersHTML();
      $("#tipbtn").remove();
    }
    inp.focus();
  };
  inp.addEventListener("keydown", e => { if(e.key === "Enter") check(); });
  $("#check").onclick = check;

  function check(){
    if(S.locked) return;
    if(!inp.value.trim()){ inp.focus(); return; }
    S.locked = true;
    const verdict = judge(inp.value, targets);
    let ok = verdict !== "no";
    inp.dataset.state = ok ? "right" : "wrong";
    inp.disabled = true;
    const meaning = CLUES[v[0]];
    const body = `<strong>${esc(v[0])} — ${esc(v[1])}</strong>`
      + (!ok && meaning ? `<br><span class="why">${esc(meaning)}</span>` : "")
      + (v[3] ? `<br>${esc(v[3])}` : "");
    const head2 = verdict === "yes" ? "Richtig"
                : verdict === "near" ? "Fast — kleiner Schreibfehler"
                : "Nicht richtig";
    $("#verd").innerHTML = `<div class="verdict" id="vd" data-tone="${ok?"right":"wrong"}">
      <h4 id="vh">${head2}</h4>
      <p>${body}${ok ? "" : "<br>Diese Karte kommt gleich noch einmal — und morgen wieder."}</p>
      ${ok ? "" : `<div class="override"><button class="tiny" id="ovr">Meine Antwort war auch richtig</button></div>`}
    </div>`;
    if(!ok) $("#ovr").onclick = () => {
      ok = true;
      $("#vd").dataset.tone = "right";
      $("#vh").textContent = "Als richtig gewertet";
      inp.dataset.state = "right";
      $("#ovr").parentElement.remove();
    };
    $("#act").innerHTML = `<button class="btn wide" id="go">Weiter</button>`;
    $("#go").onclick = () => next(ok, usedTip ? 0.5 : 1);
    $("#go").focus();
  }
}

/* ---------- Satzbau ---------- */
function renderSatz(id){
  const s = SENTENCES[idx(id)];
  const r = rec(id);
  const parts = s[0];
  const order = shuffle(parts.map((w,i)=>[w,i]));
  let placed = [];
  $("#stage").innerHTML = `
  <div class="card">
    <div class="tab"><span>Satzbau</span>${comboHTML()}</div>
    <p class="prompt" style="font-size:20px"><small>Baue diesen Satz auf Deutsch</small>${esc(s[2])}</p>
    <div class="slotline" id="line"></div>
    <div class="bank" id="bank">${order.map(([w,i])=>`<button class="chip" data-i="${i}">${esc(w)}</button>`).join("")}</div>
    <div id="verd"></div>
    <div class="actions" id="act">
      <button class="btn ghost" id="undo">Zurück</button>
      <button class="btn" id="check">Prüfen</button>
    </div>
  </div>` + railHTML();

  const bank = $("#bank"), line = $("#line");
  const draw = () => line.innerHTML = placed.map(i=>`<span class="chip placed">${esc(parts[i])}</span>`).join("");
  bank.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    if(S.locked) return;
    placed.push(+c.dataset.i); c.remove(); draw();
  });
  $("#undo").onclick = () => {
    if(S.locked || !placed.length) return;
    const i = placed.pop();
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.i = i; b.textContent = parts[i];
    b.onclick = () => { placed.push(i); b.remove(); draw(); };
    bank.appendChild(b); draw();
  };
  $("#check").onclick = () => {
    if(S.locked) return;
    if(placed.length !== parts.length){
      $("#verd").innerHTML = `<div class="verdict"><h4>Noch nicht komplett</h4><p>Setze zuerst alle Teile ein.</p></div>`;
      return;
    }
    S.locked = true;
    const ok = placed.every((v,i)=>v===i);
    line.innerHTML = placed.map((i,pos)=>`<span class="chip" data-state="${i===pos?"right":"wrong"}">${esc(parts[i])}</span>`).join("");
    $("#verd").innerHTML = `<div class="verdict" data-tone="${ok?"right":"wrong"}">
      <h4>${ok ? "Richtig" : "Diese Reihenfolge ist gemeint"}</h4>
      <p><strong>${esc(parts.join(" ").replace(/ ([,?])/g,"$1"))}</strong><br>${s[1]}</p></div>`;
    $("#act").innerHTML = `<button class="btn wide" id="go">Weiter</button>`;
    $("#go").onclick = () => next(ok);
    $("#go").focus();
  };
}

      <div><b>${P.dayXp}</b><span>heute</span></div>
    </div>

    ${got.length ? `<div class="newstamps"><h4>Neuer Stempel</h4><p>${got.map(k=>STAMPS.find(x=>x[0]===k)[1]).join(" · ")}</p></div>` : ""}
    <p class="sub">${P.dayXp >= GOAL ? "Tagesziel geschafft — die Serie läuft weiter." : (GOAL - P.dayXp) + " Punkte fehlen noch zum Tagesziel."}</p>

}

/* =====================================================================
   BLITZRUNDE — 60 Sekunden, gemischt, ohne Einfluss auf den Kasten
   ===================================================================== */
function renderBlitzIntro(){
  $("#stage").innerHTML = `
  <p class="eyebrow">Blitzrunde</p>
  <h2 class="h">60 Sekunden, so viele wie möglich</h2>
  <p class="hsub">Mixed vocabulary and grammar, four options each. A wrong answer costs three seconds. This round is just for points — it doesn't move your cards between boxes.</p>
  <div class="scoregrid">
    <div><b>${P.blitzBest}</b><span>bester lauf</span></div>
    <div><b>${P.bestCombo}</b><span>längste serie</span></div>
    <div><b>${P.dayXp}</b><span>punkte heute</span></div>
  </div>
  <div class="actions"><button class="btn wide" id="start">Los geht's</button></div>`;
  $("#start").onclick = blitzStart;
}
function blitzItem(){
  if(Math.random() < 0.5){
    const i = Math.floor(Math.random()*VOCAB.length), v = VOCAB[i];
    const same = VOCAB.filter((x,j)=>j!==i && x[2]===v[2]);
    const d = shuffle(same.length >= 3 ? same : VOCAB.filter((x,j)=>j!==i)).slice(0,3).map(x=>x[1]);
    return {q:v[0], label:v[2], opts:shuffle(d.concat([v[1]])), a:v[1]};
  }
  const g = GRAMMAR[Math.floor(Math.random()*GRAMMAR.length)];
  const topic = (GTOPICS.find(t=>t[0]===g[0])||["","Grammatik"])[1];
  return {q:g[1], label:topic, opts:shuffle(g[2]), a:g[3]};
}
function blitzStart(){
  S.bEnd = Date.now() + 60000; S.bScore = 0; S.combo = 0; S.best = 0; S.pts = 0;
  $("#stage").innerHTML = `
  <div class="timer" id="tm"><i></i></div>
  <div class="blitzhead"><span id="sec">60 s</span><span>Treffer <b id="sc">0</b></span></div>
  <div id="bq"></div>`;
  blitzQ();
  S.timer = setInterval(blitzTick, 100);
}
function blitzTick(){
  const tm = $("#tm");
  if(!tm){ clearInterval(S.timer); S.timer = null; return; }
  const left = Math.max(0, S.bEnd - Date.now());
  tm.firstElementChild.style.width = (left/60000*100) + "%";
  tm.dataset.low = left < 10000 ? 1 : 0;
  $("#sec").textContent = Math.ceil(left/1000) + " s";
  if(left <= 0){ clearInterval(S.timer); S.timer = null; blitzEnd(); }
}
function blitzQ(){
  if(!document.querySelector("#bq")) return;   // round ended while a card was still resolving
  const it = blitzItem();
  S.bItem = it;
  $("#bq").innerHTML = `
  <div class="card">
    <div class="tab"><span>${esc(it.label)}</span>${comboHTML()}</div>
    <p class="prompt" style="font-size:24px">${esc(it.q)}</p>
    <div class="opts" id="opts">${it.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
  </div>`;
  const btns = $("#opts").querySelectorAll(".opt");
  btns.forEach(b => b.onclick = () => {
    if(b.disabled) return;
    const ok = b.dataset.v === it.a;
    btns.forEach(x => x.disabled = true);
    if(ok){
      b.dataset.state = "right";
      S.bScore++; $("#sc").textContent = S.bScore;
      S.combo++; if(S.combo > S.best) S.best = S.combo;
      if(S.combo > P.bestCombo) P.bestCombo = S.combo;
      setTimeout(blitzQ, 160);
    } else {
      b.dataset.state = "wrong";
      btns.forEach(x => { if(x.dataset.v === it.a) x.dataset.state = "right"; });
      S.combo = 0;
      S.bEnd -= 3000;
      setTimeout(blitzQ, 700);
    }
  });
}
function blitzEnd(){
  const gained = S.bScore * 8;
  addXP(gained);
  if(S.bScore > P.blitzBest) P.blitzBest = S.bScore;
  const got = checkStamps({});
  store.save(P);
  const l = level();
  $("#stage").innerHTML = `
  <div class="card">
    <div class="tab"><span>Blitzrunde vorbei</span><span>${new Date().toLocaleDateString("de-DE")}</span></div>
    <p class="prompt">${S.bScore} Treffer</p>
    <div class="scoregrid">
      <div><b>+${gained}</b><span>punkte</span></div>
      <div><b>×${S.best}</b><span>beste serie</span></div>
      <div><b>${P.blitzBest}</b><span>rekord</span></div>
    </div>
    <div class="xpline"><b>${l.name}</b><span>${l.next ? (l.next[0]-P.xp) + " Pkt. bis " + l.next[1] : "höchste Stufe"}</span></div>
    <div class="track2"><i style="width:${levelPct()}%"></i></div>
    ${got.length ? `<div class="newstamps"><h4>Neuer Stempel</h4><p>${got.map(k=>STAMPS.find(x=>x[0]===k)[1]).join(" · ")}</p></div>` : ""}
    <div class="actions">
      <button class="btn ghost" id="again">Nochmal</button>
      <button class="btn" id="back">Zur Übersicht</button>
    </div>
  </div>`;
  chrome();
  $("#again").onclick = blitzStart;
  $("#back").onclick = () => go("home");
}

/* =====================================================================
   SPICKZETTEL — eine Seite pro Stufe
   ===================================================================== */
function fillGap(g){
  // shows the drill sentence with the correct answer in place
  return esc(g[1]).replace("___", "<b>" + esc(g[3]) + "</b>");
}
function renderSheet(){
  // quick-reference tables first
  const tables = (LEVEL_TABLES[CV] || []).map(key => {
    const T = TABLES[key]; if(!T) return "";
    return `<div class="sh-block">
      <h4>${esc(T.t)}</h4>
      <table class="sh-table grid">
        <tr>${T.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>
        ${T.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="rowhead"':''}>${esc(c)}</td>`).join("")}</tr>`).join("")}
      </table>
    </div>`;
  }).join("");

  // grammar: every topic with two worked examples and the rule
  const gram = GTOPICS.map(([id,name,sub])=>{
    const items = GRAMMAR.filter(g => g[0] === id);
    const shown = items.slice(0,2).map(g =>
      `<p class="ex">${fillGap(g)}</p>`).join("");
    const rule = items[0] ? items[0][4] : "";
    return `<div class="sh-block">
      <h4>${esc(name)}<span>${esc(sub)}</span></h4>
      ${shown}
      <p class="rule">${rule}</p>
    </div>`;
  }).join("");

  // verbs: the full table
  const verbs = VERBS.map(v =>
    `<tr><td>${esc(v[0])}</td><td class="en">${esc(v[1])}</td><td>${esc(v[2])}</td><td>${esc(v[3])}</td></tr>`).join("");

  // vocabulary grouped by theme
  const byTheme = {};
  VOCAB.forEach(v => { (byTheme[v[2]] = byTheme[v[2]] || []).push(v); });
  const vocab = Object.keys(byTheme).map(t =>
    `<details class="sh-theme"><summary>${esc(t)}<span>${byTheme[t].length}</span></summary>
      <table class="sh-table">${byTheme[t].map(v =>
        `<tr><td>${esc(v[0])}</td><td class="en">${esc(v[1])}</td></tr>`).join("")}</table>
     </details>`).join("");

  $("#stage").innerHTML = `
  <p class="eyebrow">Spickzettel · ${CV}</p>
  <h2 class="h">${COURSES[CV].blurb}</h2>
  <p class="hsub">Alles auf einen Blick: die Tabellen und Regeln dieser Stufe, die Verben und der ganze Wortschatz. Gut zum Nachschlagen vor einer Prüfung — oder zum Screenshot machen.</p>

  <details class="guide" open>
    <summary>Tabellen<span>${(LEVEL_TABLES[CV]||[]).length}</span></summary>
    <div class="guide-body">${tables}</div>
  </details>

  <details class="guide">
    <summary>Grammatik<span>${GTOPICS.length} Themen</span></summary>
    <div class="guide-body">${gram}</div>
  </details>

  <details class="guide">
    <summary>Verben<span>${VERBS.length}</span></summary>
    <div class="guide-body">
      <table class="sh-table verbs">
        <tr><th>Infinitiv</th><th>Englisch</th><th>Präteritum</th><th>Perfekt</th></tr>
        ${verbs}
      </table>
    </div>
  </details>

  <details class="guide">
    <summary>Wortschatz<span>${VOCAB.length}</span></summary>
    <div class="guide-body">${vocab}</div>
  </details>
`;
}

  const ids = mine();

  const solid = ids.filter(k => P.p[k].b >= 4).length;
  const l = level();
  const rows = [["vocab","Vokabeln"],["grammar","Grammatik"],["verbs","Verben"],["satz","Satzbau"]].map(([k,lab])=>{
    const saved = S.mode, savedT = S.topic;
    S.mode = k; S.topic = null;
    const all = pool(k), done = all.filter(id => rec(id) && rec(id).b >= 4).length;
    S.mode = saved; S.topic = savedT;
    return `<div class="bar"><span class="name">${lab}</span>
      <span class="track"><span class="fill" style="width:${Math.round(done/all.length*100)}%"></span></span>
      <span class="num">${done}/${all.length}</span></div>`;

  <p class="hsub">${l.gloss} · ${P.xp} Punkte gesamt${l.next ? ` · noch ${l.next[0]-P.xp} bis ${l.next[1]}` : " · höchste Stufe erreicht"}</p>

    <div class="stat"><b>${solid}</b><span>karten sitzen</span></div>
    <div class="stat"><b>${P.bestCombo}</b><span>längste serie</span></div>
  </div>
  <div class="divider"></div>
  <p class="eyebrow">${CV} · ${seen} von ${courseSize(CV)} Karten angefangen</p>
  <div class="bars">${rows}</div>
  <div class="divider"></div>
  <p class="eyebrow">Karteikasten</p>
  ${kastenBoard()}
  <div class="divider"></div>
  <p class="eyebrow">Stempel · ${Object.keys(P.stamps).length} von ${STAMPS.length}</p>
  <div class="stamps">
    ${STAMPS.map(s=>`<div class="stamp" data-on="${P.stamps[s[0]]?1:0}"><b>${s[1]}</b><span>${s[2]}</span></div>`).join("")}
  </div>
  <div class="divider"></div>
  <p class="eyebrow">Tagesziel</p>
  <div class="caps">
    ${MINUTES.map(c=>`<button class="capbtn" data-cap="${c}" data-on="${goalMin()===c?1:0}">${c} Min</button>`).join("")}
  </div>
  <p class="note">Daraus ergeben sich etwa <b>${dailyCards()} Karten pro Tag</b>, aufgeteilt auf die vier Bereiche. Fällige Wiederholungen kommen zuerst, der Rest wird mit neuen Karten gefüllt. Wenn du fertig bist, kannst du auf der Startseite den Stoff von morgen vorziehen.</p>
  <div class="divider"></div>
  <p class="eyebrow">Name</p>
  <p class="note">Angemeldet als <b>${esc(P.name && P.name !== "–" ? P.name : "ohne Namen")}</b> · <button class="tiny" id="rename">ändern</button></p>
  <div class="divider"></div>
  <p class="eyebrow">Sicherung${P.lastBackup ? " · zuletzt vor " + (DAY()-P.lastBackup) + " Tagen" : ""}</p>
  <p class="note">Progress is stored in this browser. If you clear the browser data or open the file on another device, save a backup first and load it there.</p>
  <div class="actions">
    <button class="btn ghost" id="exp">Sicherung speichern</button>
    <button class="btn ghost" id="imp">Sicherung laden</button>
  </div>
  <input type="file" id="file" accept="application/json" class="hidden">
  <div class="divider"></div>
  <div class="actions"><button class="btn ghost" id="reset">Fortschritt zurücksetzen</button></div>
  <p class="note" id="msg"></p>
  <p class="note" style="text-align:center;opacity:.5">DEKurs Version ${APP_VERSION}</p>`;

  $("#stage").querySelectorAll("[data-cap]").forEach(b => b.onclick = () => {
    P.goalMin = +b.dataset.cap;
    store.save(P); renderStats();
  });
  $("#rename").onclick = () => {
    const n = prompt("Wie heißt du?", P.name === "–" ? "" : P.name);
    if(n === null) return;
    P.name = n.trim().slice(0,24) || "–";
    store.save(P); renderStats();
  };
  $("#exp").onclick = () => {
    const blob = new Blob([JSON.stringify(P)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "karteikasten-fortschritt.json";
    a.click(); URL.revokeObjectURL(a.href);
    P.lastBackup = DAY(); store.save(P);
    $("#msg").textContent = "Sicherung gespeichert. Lege die Datei irgendwo ab, wo du sie wiederfindest.";
  };
  $("#imp").onclick = () => $("#file").click();
  $("#file").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const o = JSON.parse(rd.result);
        if(o && o.p){ P = Object.assign({p:{},xp:0,streak:0,goalDay:0,dayD:0,dayXp:0,bestCombo:0,blitzBest:0,stamps:{},dir:"de",sessions:0,ansBySec:{},bonusBySec:{},name:"",lastBackup:0,goalMin:15}, o);
          store.save(P); chrome(); renderStats(); $("#msg").textContent = "Sicherung geladen."; }
      }catch(err){ $("#msg").textContent = "Die Datei konnte nicht gelesen werden. Bitte wähle karteikasten-fortschritt.json."; }
    };
    rd.readAsText(f);
  };
  $("#reset").onclick = () => {
    if(!confirm("Alle Karten, Punkte und Stempel zurücksetzen?")) return;
    P = { p:{}, xp:0, streak:0, goalDay:0, dayD:0, dayXp:0, bestCombo:0, blitzBest:0, stamps:{}, dir:P.dir, sessions:0, ansBySec:{}, bonusBySec:{}, course:P.course,
         name:P.name, lastBackup:0, goalMin:P.goalMin };
    store.save(P); chrome(); renderStats();
  };
}

/* ---------- Tastatur ---------- */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.key === "Enter" || e.key === " "){
    const b = $("#go") || $("#flip") || $("#check") || $("#start");
    if(b){ e.preventDefault(); b.click(); }
  }
  if(/^[1-4]$/.test(e.key)){
    const o = document.querySelectorAll(".opt");
    if(o[+e.key-1] && !o[+e.key-1].disabled) o[+e.key-1].click();
  }
});

/* ---------- Start ---------- */
(async function(){
  const saved = await store.load();
  if(saved) P = Object.assign(P, saved);
  useCourse(P.course || "B1.1");
  touchDay();
  // migrate progress saved before courses existed
  let migrated = false;
  for(const k in P.p) if(k.indexOf("|") === -1){ P.p["B1.1|" + k] = P.p[k]; delete P.p[k]; migrated = true; }
  if(migrated) store.save(P);
  document.getElementById("brand").onclick = () => go("welcome");
  if(!P.name) go("name");
  else if(P.course && COURSES[P.course]){ useCourse(P.course); go("home"); }
  else go("welcome");
})();
